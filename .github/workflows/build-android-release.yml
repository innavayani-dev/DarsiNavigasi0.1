name: Build Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Unity Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Immersal Developer Token from GitHub Secrets
        run: |
          mkdir -p Assets/Resources
          echo "Injecting IMMERSAL_DEVELOPER_TOKEN into Assets/Resources/appconfig.json..."
          cat <<EOF > Assets/Resources/appconfig.json
          {
            "immersalToken": "${{ secrets.IMMERSAL_DEVELOPER_TOKEN }}"
          }
          EOF
          echo "appconfig.json successfully generated for build."

      - name: Cache Unity Library Folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-AndroidBuild-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-AndroidBuild-
            Library-

      - name: Build Unity Android APK via GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.62f2
          androidAppBundle: false
          androidKeystoreName: ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYSTORE_PASS }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarsiNavigasi-Android-Build
          path: build/Android

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Android/*.apk
          draft: false
          prerelease: false
          name: DarsiNavigasi ${{ github.ref_name }}
          body: |
            ## DarsiNavigasi Android Release (${{ github.ref_name }})
            
            Aplikasi Android AR Indoor Navigation RS Islam Ahmad Yani Surabaya.
            
            ### Detail Rilis:
            - **Unity Target**: 2022.3.62f2 LTS
            - **VPS Engine**: Immersal SDK 2.2.1
            - **Pathfinding**: Unity NavMesh + NavMeshLink
            
            Unduh file `.apk` di bawah dan install pada perangkat Android fisik untuk uji lapangan.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
